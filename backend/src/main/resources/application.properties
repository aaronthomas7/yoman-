spring.application.name=backend

# Railway (and most PaaS hosts) inject $PORT for the app to bind. Locally
# spring-dotenv won't set PORT, so the default 8080 kicks in.
server.port=${PORT:8080}

# Loaded from backend/.env via spring-dotenv when running locally.
# On Railway these come from the service's env-var settings.
# Never commit .env.
openai.api-key=${OPENAI_API_KEY}
openai.whisper.model=whisper-1
openai.base-url=https://api.openai.com/v1

# Whisper bias prompt — short, comma-separated list of terms to lock in
# spellings. Weekend 4+ will replace this with a per-user prompt built
# from user_context (preferred name, languages, important people, etc).
openai.whisper.prompt=Yoman, voice journaling app.

# Allow multipart audio uploads up to ~10 MB
# (a 5-minute m4a is around 2-3 MB; ample headroom).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Anthropic Claude (entry structuring). Loaded from backend/.env.
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
anthropic.base-url=https://api.anthropic.com/v1
anthropic.max-tokens=1024

# Postgres (Supabase). DATABASE_URL loaded from backend/.env and parsed
# in DatabaseConfig so the DataSource bean overrides Spring Boot's
# auto-config. Flyway migrations live in src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
