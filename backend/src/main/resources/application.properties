spring.application.name=backend

# Railway (and most PaaS hosts) inject $PORT for the app to bind. Locally
# spring-dotenv won't set PORT, so the default 8080 kicks in.
server.port=${PORT:8080}

# Loaded from backend/.env via spring-dotenv when running locally.
# On Railway these come from the service's env-var settings.
# Never commit .env.
openai.api-key=${OPENAI_API_KEY}
openai.whisper.model=whisper-1
openai.base-url=https://api.openai.com/v1
# Connect timeout: TLS handshake should be fast. Read timeout: Whisper
# can take up to ~60s for multi-minute audio; 120s gives headroom while
# still failing well before Railway's edge proxy gives up.
openai.connect-timeout-ms=10000
openai.read-timeout-ms=120000

# Whisper bias prompt — short, comma-separated list of terms to lock in
# spellings. Weekend 4+ will replace this with a per-user prompt built
# from user_context (preferred name, languages, important people, etc).
openai.whisper.prompt=Yoman, voice journaling app.

# Allow multipart audio uploads up to ~10 MB
# (a 5-minute m4a is around 2-3 MB; ample headroom).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Anthropic Claude (entry structuring). Loaded from backend/.env.
# claude-sonnet-4-5 retires on the Claude API on 2026-11-30; Sonnet 5.5 is
# its replacement (and cheaper). If ANTHROPIC_MODEL is set on Railway it
# overrides this default, so update or remove it there too.
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
anthropic.base-url=https://api.anthropic.com/v1
# On Sonnet 5.5 max_tokens covers thinking plus the reply, and its tokenizer
# counts ~30% more tokens than 4.5's. You only pay for tokens used.
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:4096}
# Lowest thinking setting and low effort: structuring needs no deliberation.
# Set either variable to an empty value to leave it out of the request.
anthropic.thinking=${ANTHROPIC_THINKING:between_tools}
anthropic.effort=${ANTHROPIC_EFFORT:low}
# Claude is typically ~5-15s; 60s read timeout gives 4x headroom.
anthropic.connect-timeout-ms=10000
anthropic.read-timeout-ms=60000

# Shared app key. Every request except /health must send it in the
# X-Yoman-Key header (see security/ApiKeyFilter). Temporary lock until
# Supabase Auth: a key shipped inside an app can be extracted, so this is
# for personal use, not a public release. If it's unset, requests get 503.
yoman.api-key=${YOMAN_API_KEY:}

# Postgres (Supabase). DATABASE_URL loaded from backend/.env and parsed
# in DatabaseConfig so the DataSource bean overrides Spring Boot's
# auto-config. Flyway migrations live in src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
